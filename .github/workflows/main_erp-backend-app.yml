# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - erp-backend-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build
        working-directory: ./backend
        run: |
          npm ci
          npm run build
          echo "Build completed successfully"

      - name: Prepare deployment package
        working-directory: ./backend
        run: |
          # Azure Oryx 빌드용 패키지 준비
          # node_modules는 Azure에서 설치하도록 제외
          mkdir -p ../deploy-package
          cp -r dist ../deploy-package/
          cp package.json ../deploy-package/
          cp package-lock.json ../deploy-package/

          # 배포 패키지 검증
          echo "=== Deploy package contents ==="
          ls -la ../deploy-package/
          echo ""
          echo "=== dist folder ==="
          ls -la ../deploy-package/dist/

      - name: Zip artifact for deployment
        run: |
          cd deploy-package
          zip -r ../release.zip .
          echo "Zip size: $(du -h ../release.zip | cut -f1)"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip -d ./deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C56548545ABB4E5BA06EAFDE56A1ABCC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4D81AAC46C684F289739A8A657864200 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3105569761264EA88E7815FD124D59CE }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'erp-backend-app'
          slot-name: 'Production'
          package: ./deploy
