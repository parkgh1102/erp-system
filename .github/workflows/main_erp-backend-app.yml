# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - erp-backend-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install, build, and prepare package
        working-directory: ./backend
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Installing dependencies ==="
          npm install 2>&1 || { echo "npm install failed"; exit 1; }
          echo "=== Checking node_modules ==="
          ls -la
          ls -la node_modules | head -20 || echo "node_modules not found"
          echo "=== Building ==="
          npm run build
          echo "=== Preparing package ==="
          mkdir -p ../deploy-package
          cp -r dist ../deploy-package/
          cp -r node_modules ../deploy-package/
          cp package.json ../deploy-package/
          cd ../deploy-package
          zip -r ../release.zip .
          echo "=== Zip size ==="
          du -h ../release.zip

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'erp-backend-app'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: release.zip
