name: Azure Static Web Apps CI/CD

# 프로덕션 배포는 main push에서만 수행.
# (PR 프리뷰/staging 환경은 SWA 플랜 미지원으로 매 PR 실패하던 원인이라 제거.
#  PR 빌드 검증은 ci.yml에서 수행)
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_OCEAN_03A1F7000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "./frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        env:
          VITE_API_URL: https://api.webapperp.ai.kr/api
          VITE_APP_ENV: production
          VITE_APP_NAME: ERP 통합시스템
          VITE_APP_VERSION: 1.0.0
          VITE_ENABLE_LOGGING: false
          VITE_ENFORCE_HTTPS: true
          VITE_ENABLE_DEVTOOLS: false
